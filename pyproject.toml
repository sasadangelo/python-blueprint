[project]
authors = [
  {name = "Salvatore D'Angelo", email = "sasadangelo@gmail.com"},
]
description = "A Python boilerplate with integrated dev and security tools"
name = "python-boilerplate"
readme = "README.md"
requires-python = ">=3.10,<3.15"
version = "0.1.0"

dependencies = [
  "pydantic>=2.3,<3",
  "requests>=2.31.0,<3",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8.1,<2",
  "black>=23.12.0,<24",
  "coverage>=7.3.2,<8",
  "detect-secrets>=1.1.0,<2",
  "flake8>=6.1.0,<7",
  "isort>=5.12.0,<6",
  "mypy>=1.5.1,<2",
  "pre-commit>=3.4.0,<4",
  "pytest>=8.2.0,<9",
  "radon>6",
]

[tool.uv]
# Python version enforcement
required-version = "0.9.7"

[project.scripts]
format = "black src tests && isort src tests"
hello = "example:hello"
lint = "ruff check src tests"
test = "pytest tests --maxfail=1 --disable-warnings -q"
typecheck = "mypy src"

[tool.isort]
include_trailing_comma = true
line_length = 120
multi_line_output = 3
profile = "black"
skip = [".venv", "__pycache__", "build", "dist"]

[tool.flake8]
exclude = [".venv"]
extend-ignore = ["E203", "W503"]
max-line-length = 120
